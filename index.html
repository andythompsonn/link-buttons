<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Link Buttons</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial;margin:2rem}
    .buttons{display:flex;gap:0.5rem;flex-wrap:wrap}
    .btn{padding:0.6rem 1rem;background:#0366d6;color:#fff;border-radius:6px;text-decoration:none}
    .controls{margin-top:1rem}
    input{padding:0.4rem;margin-right:0.5rem}
  </style>
</head>
<body>
  <h1>Link Buttons</h1>
  <div class="buttons" id="buttons"></div>

  <div class="controls">
    <input id="label" placeholder="Label" />
    <input id="href" placeholder="https://example.com" />
    <button id="add">Add button</button>
    <button id="clear">Clear all</button>
  </div>

  <script>
    const STORAGE_KEY = 'link-buttons:items'
    const buttonsEl = document.getElementById('buttons')
    const labelEl = document.getElementById('label')
    const hrefEl = document.getElementById('href')
    const addBtn = document.getElementById('add')
    const clearBtn = document.getElementById('clear')

    function load(){
      try{
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]')
      }catch(e){return []}
    }
    function save(items){ localStorage.setItem(STORAGE_KEY, JSON.stringify(items)) }

    function render(){
      buttonsEl.innerHTML = ''
      const items = load()
      for(const it of items){
        const a = document.createElement('a')
        a.className = 'btn'
        a.href = it.href
        a.target = '_blank'
        a.textContent = it.label
        buttonsEl.appendChild(a)
      }
    }

    addBtn.addEventListener('click', ()=>{
      const label = labelEl.value.trim()
      const href = hrefEl.value.trim()
      if(!label || !href) return alert('Fill both label and URL')
      const items = load()
      items.push({label, href})
      save(items)
      labelEl.value = hrefEl.value = ''
      render()
    })

    clearBtn.addEventListener('click', ()=>{
      if(!confirm('Clear all buttons?')) return
      save([])
      render()
    })

    render()
  </script>
</body>
</html>
